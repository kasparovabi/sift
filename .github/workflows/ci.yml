name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Assemble the app bundle
        run: ./scripts/make-app.sh release

  web:
    # The Windows/Linux build shares no code with the app, so it is tested on the
    # platforms it is actually for.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: node --test web/test/sift.test.mjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test windows/Sift.Tests/Sift.Tests.csproj -c Release
      - name: Publish the WPF build
        run: dotnet publish windows/Sift/Sift.csproj -c Release -r win-x64 -o publish
      - name: Install the WinUI 3 templates
        run: dotnet new install Microsoft.WindowsAppSDK.WinUI.CSharp.Templates
      - name: Publish the WinUI 3 build
        run: dotnet publish windows-winui/SiftWinUI.csproj -c Release -r win-x64 -o publish-winui
